# 主角：只写现在的状况和能力；变化过程进 分集记录.yaml
# 只给作者看，不写进正文。由记录员在每集定稿后更新。
# 写法：缩进两个空格；字符串一律加双引号；只记正文写出来、又影响后面剧情的东西。
# 证据写集号加一句不超过 30 字的原文；数量没写清就写“约”或“待确认”，不要猜。
# 一件事只记一处：别的文件要提，只写“见 线索.yaml”这类指向。
"截至": "第01集结束"
"时间":
  "日期": "〔故事内日期〕"
  "天数": "〔灾变后第几天〕"
"身体":
  "〔伤情、病况或倒计时〕":
    "起算": "〔哪天，因为什么〕"
    "现状": "〔〕"
    "依据": "第01集：〔原文一小句〕"
"技能":
  # 正文里没有学会它的戏，就不算会
  "〔技能名〕":
    "程度": "〔一句话，不打分〕"
    "来路": "〔本行 / 第几集从什么现学〕"
    "边界": "〔还不会什么〕"
