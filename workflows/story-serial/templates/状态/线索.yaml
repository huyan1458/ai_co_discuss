# 写法：缩进两个空格；字符串一律加双引号；只记正文写出来、又影响后面剧情的东西。
# 只记两种：读者会等结果的悬念和伏笔；人物之间没了结的约定和欠账。广播口信、环境细节不记；已回收的整条删掉，回收写进分集记录。证据一句不超过 30 字的原文；“停了几集”由状态检查计算，不写。
# 一件事只记一处：别的文件要提，只写“见 线索.yaml”这类指向。
