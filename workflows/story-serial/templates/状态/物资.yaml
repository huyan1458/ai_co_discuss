# 物资：只写现在的库存，按地点分组；重要器物、载具与能源也在这里
# 只给作者看，不写进正文。由记录员在每集定稿后更新。
# 写法：缩进两个空格；字符串一律加双引号；只记正文写出来、又影响后面剧情的东西。
# 一条不超过 80 字，只写数量、位置或状态、来源集号，不带引文，不写经过（经过只进分集记录）。收录门槛：只记会左右人物选择的东西，即燃料、食物与水、药、能源设备、载具、交换物、关键工具，以及作者打算回头用的物件；分集记录里的“得到、用掉、失去”同样按这个门槛。门槛以内数量没写清的标“待确认”，门槛以外的不记。
# 一件事只记一处：别的文件要提，只写“见 线索.yaml”这类指向。
"库存":
  "〔地点：随身 / 某据点 / 藏货点〕":
    "〔物品〕": "〔数量；位置或状态；来自第01集〕"
"能源与载具":
  "〔载具 / 能源 / 重要器物〕": "〔数量；余量；能不能用；来自第几集〕"
