# 分集记录：每集一段，只写这一集的变化
# 只给作者看，不写进正文。由记录员在每集定稿后更新。
# 写法：缩进两个空格；字符串一律加双引号；只记正文写出来、又影响后面剧情的东西。
# 每集不超过 15 行，一行一个变化，带一句不超过 30 字的原文；引文只在这里出现。物品的“得到、用掉、失去”按物资.yaml 文件头的收录门槛记；门槛以内数量没写清的标“待确认”，门槛以外的不记。
# 一件事只记一处：别的文件要提，只写“见 线索.yaml”这类指向。
"分集记录":
  - "集数": "第01集"
    "日期": "〔故事内日期〕"
    "得到": ["〔〕"]
    "用掉": ["〔〕"]
    "失去": ["〔〕"]
    "看见": ["〔〕"]
    "学到": ["〔〕"]
